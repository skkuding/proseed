apiVersion: batch/v1
kind: Job
metadata:
  name: proseed-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '1'
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: stage
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16.10-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres-svc -p 5432 -U "${username}" -d skkuding; do sleep 2; done
          envFrom:
            - secretRef:
                name: database-credentials
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
